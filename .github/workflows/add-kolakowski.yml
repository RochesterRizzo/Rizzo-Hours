name: Add Kolakowski dossier

on:
  push:
    branches:
      - feature/inheritance-kolakowski
    paths:
      - .github/workflows/add-kolakowski.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inheritance-kolakowski
      - name: Patch Inheritance center
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('inheritance/index.html')
          s = p.read_text(encoding='utf-8')

          nav_old = '<a href="#marxcusianism-boriquagato">Marxcusianism dossier</a><a href="#library">Essential works</a>'
          nav_new = '<a href="#marxcusianism-boriquagato">Marxcusianism dossier</a><a href="#kolakowski-marxism">Kołakowski dossier</a><a href="#library">Essential works</a>'
          if nav_old not in s:
              raise SystemExit('navigation marker not found')
          s = s.replace(nav_old, nav_new, 1)

          marker = '<section class="box" id="library"><h2>Essential works: the first shelf</h2><div class="library">'
          if marker not in s:
              raise SystemExit('library marker not found')

          dossier = '''<section class="box"><h2>Third dossier: Leszek Kołakowski — Marxism judged from the inside</h2><details class="dossier" id="kolakowski-marxism"><summary><span class="k">Verified history · insider critique · click to open</span><span class="t">The philosopher the communist system cultivated—and then expelled when he followed the argument where it led</span></summary><div class="inside"><div class="note"><strong>Why this belongs:</strong> the basic story is true, and it is better than the viral version because the documented history needs very little embellishment. Kołakowski began as an orthodox Marxist inside communist Poland, became one of its leading revisionists, was expelled from the party and then the university, and eventually wrote one of the great intellectual histories and critiques of Marxism. But one popular formulation goes too far: he did <em>not</em> claim that Stalinism was the one and only possible reading of Marx.</div><p><span class="label">Poland</span><span class="label">Marxism</span><span class="label">revisionism</span><span class="label">Stalinism</span><span class="label">totalitarianism</span><span class="label">Solidarity</span><span class="label">intellectual history</span></p><div class="pull">The strongest defensible lesson is not “Stalin merely read Marx correctly.” It is harsher and more interesting: Leninism and Stalinism were not alien accidents pasted onto an innocent doctrine. Kołakowski argued that important Marxian premises made the totalitarian development historically intelligible—and, under certain assumptions about unity, class, truth, and emancipation, dangerously natural.</div><div class="theses"><article class="thesis"><h3>1. Poland really was a Soviet-dominated communist party-state—but “one-party” needs one footnote.</h3><p>Postwar Poland was not incorporated into the USSR, but it became a Soviet satellite. The Polish United Workers’ Party (PZPR) dominated political life, the legislature, mass organizations, unions, and the press. Two legal satellite parties existed, so “one-party state” is shorthand rather than a literal description of the ballot. They had little independent power.</p><p><a href="https://tile.loc.gov/storage-services/master/frd/frdcstdy/po/polandcountrystu00curt_0/polandcountrystu00curt_0.pdf" target="_blank" rel="noopener noreferrer">Library of Congress: Poland country study</a></p></article><article class="thesis"><h3>2. Kołakowski was an insider, and a very serious one.</h3><p>Born in 1927, he emerged from the German occupation as a committed communist and orthodox Marxist. The best Library of Congress account places his entry into the communist party in 1945, not 1947. In 1950 the party sent him to Moscow as one of its promising young intellectuals; the visit helped expose him to what he later described as the material and spiritual devastation of Stalinism.</p><p>He earned his doctorate at Warsaw University in 1953 and became professor and chairman of its section on the history of philosophy from 1959 to 1968. He was not a marginal crank shouting from outside the system. He was one of the most important Marxist philosophers produced inside it.</p><p><a href="https://www.loc.gov/programs/john-w-kluge-center/kluge-prize/past-winners/item/n50044434/leszek-kolakowski-1927-2009/" target="_blank" rel="noopener noreferrer">Library of Congress biography</a></p></article><article class="thesis"><h3>3. The break begins before the famous 1956 thaw.</h3><p>The neat version says Khrushchev’s February 1956 secret speech suddenly cracked the faith. Reality was more gradual. Kołakowski’s 1950 Moscow experience already disturbed him. Stalin’s death, the Poznań workers’ revolt, Khrushchev’s denunciation of Stalinist crimes, and the Polish October widened the opening.</p><p>Khrushchev’s speech exposed fabricated cases, torture, executions, deportations, and mass repression. Calling it simply an “official admission that Stalin murdered millions” is too compressed: the speech was a devastating internal indictment of Stalin, but not a complete accounting of Soviet mass death.</p><p><a href="https://www.marxists.org/archive/khrushchev/1956/02/24.htm" target="_blank" rel="noopener noreferrer">Khrushchev’s 1956 speech</a></p></article><article class="thesis"><h3>4. <em>What Is Socialism?</em> is real—and savage.</h3><p>The essay dates to 1956, not 1957. It was intended for the student journal <em>Po Prostu</em>, was suppressed by the censors, circulated privately, and appeared in English soon afterward. Its form is lethal: an extended list of everything socialism is <em>not</em>—police fear, compulsory lying, censorship, bureaucratic domination, slave labor, rulers choosing themselves—followed by an ironic non-definition of the wonderful socialism that somehow never resembles the socialist states actually in existence.</p><p>This is exactly the kind of primary document the Inheritance project should preserve: not an outsider’s Cold War caricature, but a Marxist intellectual inside the system discovering that the regime’s language and the regime’s reality no longer fit together.</p><p><a href="https://savingcommunities.org/docs/kolakowski.leszek/whatissocialism.html" target="_blank" rel="noopener noreferrer">Read “What Is Socialism?”</a> · <a href="https://www.marxists.org/history/etol/newspape/newsletter/newsletter-v-1-no-32-14december57.pdf" target="_blank" rel="noopener noreferrer">1957 English historical reprint</a></p></article><article class="thesis"><h3>5. “Revisionism” became the name for refusing to pretend.</h3><p>Kołakowski initially tried to rescue a humanist Marxism from Stalinist orthodoxy. That is crucial. His path was not capitalist apologetics followed by communist retaliation. It was an internal argument: return to human dignity, reject dogma, stop treating the party line as philosophy. The regime answered with the standard accusation—revisionism.</p><p>By 1966, on the tenth anniversary of the Polish October, he publicly charged that the party had betrayed the reformist promises of 1956. The PZPR expelled him.</p></article><article class="thesis"><h3>6. March 1968 finished the expulsion from institutional life.</h3><p>In March 1968 Warsaw students protested censorship and political repression. The regime crushed the movement and launched a broader purge of students and intellectuals, intertwined with an ugly “anti-Zionist” campaign. Kołakowski, already expelled from the party, lost his university post and went into exile.</p><p>The chronology matters: party expulsion in 1966; university dismissal in 1968. His works then circulated underground and later helped shape the Polish intellectual opposition and Solidarity.</p><p><a href="https://www.loc.gov/loc/lcib/0312/kluge2.html" target="_blank" rel="noopener noreferrer">Library of Congress: Scholar and Activist</a></p></article><article class="thesis"><h3>7. Exile did not marginalize him. It internationalized him.</h3><p>He taught at McGill in 1968–69 and Berkeley in 1969–70, became Senior Research Fellow at All Souls College, Oxford, in 1970, spent part of 1974 at Yale, and from 1981 to 1994 also taught part-time at the University of Chicago in philosophy and the Committee on Social Thought.</p><p><a href="https://www.asc.ox.ac.uk/person/dr-leszek-kolakowski" target="_blank" rel="noopener noreferrer">All Souls College biography</a> · <a href="https://news.uchicago.edu/story/leszek-kolakowski-renowned-philosopher-1927-2009" target="_blank" rel="noopener noreferrer">University of Chicago obituary</a></p></article><article class="thesis"><h3>8. Then came <em>Main Currents of Marxism</em>.</h3><p>Written largely in exile between 1968 and 1976, the work first appeared in Polish in Paris in 1976 and in English in three volumes in 1978: <em>The Founders</em>, <em>The Golden Age</em>, and <em>The Breakdown</em>. The original English volumes total more than 1,500 pages; later one-volume editions are shorter through repagination.</p><p>It is safer to call it one of the most important and comprehensive histories of Marxist thought than “the most exhaustive work ever written.” Tony Judt called it the most important book on Marxism of the preceding half-century.</p><p><a href="https://openlibrary.org/books/OL4739398M/Main_currents_of_Marxism" target="_blank" rel="noopener noreferrer">Open Library / Internet Archive record</a> · <a href="https://www.nybooks.com/articles/2006/09/21/goodbye-to-all-that/" target="_blank" rel="noopener noreferrer">Tony Judt on <em>Main Currents</em></a></p></article><article class="thesis"><h3>9. The devastating conclusion—and the necessary correction.</h3><p>Kołakowski’s mature judgment was that the disasters of communist rule could not simply be quarantined from Marxist theory with the incantation “real socialism was never tried.” He traced a route from Marx’s dream of total human emancipation, social unity, and historical self-knowledge to a politics in which the party could claim to embody historical reason. Once a political organization claims privileged possession of history’s truth, dissent can be recoded as ignorance, class hostility, or counterrevolution.</p><p>But do not put words in his mouth. He acknowledged that the Leninist-Stalinist construction was <em>a possible interpretation, though not the only possible interpretation</em>, of Marx. His claim is therefore not “Marx logically entails Stalin in every conceivable reading.” It is that central strains of Marxism contained intellectual resources that made Leninist dictatorship and Stalinist domination far less accidental than revisionists wanted to believe.</p><p><a href="https://www.nybooks.com/articles/1980/05/29/low-marx/" target="_blank" rel="noopener noreferrer">Steven Lukes: “Low Marx” — the crucial argument and qualification</a></p></article><article class="thesis"><h3>10. The irony survives every correction.</h3><p>The viral ending is rhetorically irresistible: the communist system helped educate one of its finest Marxist minds, demanded intellectual loyalty, and eventually expelled him when serious philosophy ceased producing politically convenient answers. He then wrote a work that treated Marxism with more historical breadth and intellectual seriousness than party catechisms ever could.</p><p>The better lesson is not that a regime deliberately trained “the man who would destroy Marxism.” That is storytelling. The documented lesson is more useful: a system that claims scientific certainty eventually has a problem with genuine inquiry. If the conclusions are fixed in advance, philosophy becomes propaganda. If the inquiry is genuine, the conclusions cannot be guaranteed.</p></article></div><div class="questions"><strong>Questions for this dossier:</strong><ol><li>Which parts of Marx does Kołakowski think create the road toward Leninism and Stalinism?</li><li>What exactly is the difference between saying totalitarianism is a <em>possible</em>, a <em>natural</em>, or a <em>necessary</em> development of Marxism?</li><li>Why did revisionist Marxists keep trying to rescue an “early” or “humanist” Marx from communist regimes?</li><li>Does the party’s treatment of Kołakowski demonstrate a general problem of ideologies that claim privileged historical knowledge?</li><li>How does <em>What Is Socialism?</em> compare the ideals of socialism with the revealed institutions of socialist states?</li><li>What did Kołakowski retain from Marx after rejecting Marxism?</li><li>Why did his later defense of pluralism, incomplete knowledge, transcendence, and human rights matter to Solidarity?</li></ol></div></div></details></section>'''

          s = s.replace(marker, dossier + marker, 1)

          lib_add = '''<details><summary><span class="wt">Leszek Kołakowski: biography and intellectual trajectory</span><span class="meta">Library of Congress · verified orientation</span></summary><div class="inside"><p>From orthodox Marxism and the Polish communist establishment to revisionism, expulsion, exile, Solidarity, and a major critique of Marxism.</p><a href="https://www.loc.gov/programs/john-w-kluge-center/kluge-prize/past-winners/item/n50044434/leszek-kolakowski-1927-2009/" target="_blank" rel="noopener noreferrer">Library of Congress</a></div></details><details><summary><span class="wt">“What Is Socialism?”</span><span class="meta">Leszek Kołakowski · 1956 · primary text</span></summary><div class="inside"><p>A devastating internal critique of Stalinist reality written while Kołakowski still identified with revisionist Marxism.</p><a href="https://savingcommunities.org/docs/kolakowski.leszek/whatissocialism.html" target="_blank" rel="noopener noreferrer">Read the text</a></div></details><details><summary><span class="wt"><em>Main Currents of Marxism</em></span><span class="meta">Leszek Kołakowski · 1976/1978 · intellectual history</span></summary><div class="inside"><p>Three volumes tracing Marxist thought from its philosophical origins through Leninism, Stalinism, and twentieth-century dissolution.</p><a href="https://openlibrary.org/books/OL4739398M/Main_currents_of_Marxism" target="_blank" rel="noopener noreferrer">Book record / borrowing options</a> · <a href="https://www.nybooks.com/articles/1980/05/29/low-marx/" target="_blank" rel="noopener noreferrer">Read Steven Lukes’s critical review</a></div></details>'''
          s = s.replace(marker, marker + lib_add, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add inheritance/index.html
          git commit -m "Add verified Leszek Kolakowski dossier"
          git push origin HEAD:feature/inheritance-kolakowski
