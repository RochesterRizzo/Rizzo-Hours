name: Unwrap Environmental Week One Static Page

on:
  push:
    paths:
      - '.github/workflows/final-env-repair.yml'

permissions:
  contents: write

jobs:
  unwrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Replace loader with static page
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re, base64, gzip
          p = Path('weekly/environmental-economics/fall-2026/week-01/index.html')
          html = p.read_text(encoding='utf-8')
          m = re.search(r"const b64='([^']+)'", html)
          if not m:
              raise SystemExit('No embedded b64 loader found')
          static = gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          p.write_text(static, encoding='utf-8')
          PY
      - name: Commit static page and remove workflow
        run: |
          rm -f .github/workflows/final-env-repair.yml
          rm -f .github/workflows/patch-env-html-media-direct.yml
          rm -f .github/workflows/reset-env-week-one-source.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add -A
          git commit -m "Publish Environmental Week One static page"
          git push