name: Fix EWOT Week One Image Sources

'on':
  push:
    paths:
      - '.github/workflows/fix-week-one-image-srcs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace image sources
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('weekly/ewot/fall-2026/week-01/index.html')
          html = p.read_text(encoding='utf-8')
          css = '''
    img.doc-image {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 18px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
'''
          if 'img.doc-image {' not in html:
              html = html.replace('</style>', css + '  </style>')
          pairs = [
              ('Week One update image 1','assets/image1.svg'),
              ('Week One update image 2','../../../../Outside_Hours_Location.png'),
              ('Week One update image 3','../../../../poster-files/engerman-hornbeck-after-shocks-poster.png'),
              ('Week One update image 4','assets/image4.svg'),
              ('Week One update image 5','assets/image5.svg'),
              ('Week One update image 6','assets/image6.svg'),
          ]
          for alt, src in pairs:
              pos = html.find('alt="' + alt + '"')
              if pos < 0:
                  print('missing alt', alt)
                  continue
              start = html.rfind('<img', 0, pos)
              end = html.find('>', pos)
              old = html[start:end+1]
              if 'src=' in old:
                  new = re.sub('src="[^"]*"', 'src="' + src + '"', old, count=1)
              else:
                  new = old[:-1] + ' src="' + src + '">'
              html = html[:start] + new + html[end+1:]
          html = re.sub(r'\s*<section class="issue-section" id="images-restored">.*?</section>\s*(?=</article>)', '\n', html, flags=re.S)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-week-one-image-srcs.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add weekly/ewot/fall-2026/week-01/index.html .github/workflows/fix-week-one-image-srcs.yml
          git commit -m "Fix Week One image source paths"
          git push
