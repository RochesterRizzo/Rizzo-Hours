name: Fix EWOT Week One Images

on:
  push:
    paths:
      - '.github/workflows/fix-week-one-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Restore image displays
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html
          base = Path('weekly/ewot/fall-2026/week-01')
          assets = base / 'assets'
          assets.mkdir(parents=True, exist_ok=True)
          html_path = base / 'index.html'
          text = html_path.read_text(encoding='utf-8')
          repl = {
              'src="assets/image1.jpg"': 'src="assets/image1.svg"',
              'src="assets/image2.jpg"': 'src="../../../../Outside_Hours_Location.png"',
              'src="assets/image3.jpg"': 'src="../../../../poster-files/engerman-hornbeck-after-shocks-poster.png"',
              'src="assets/image4.jpg"': 'src="assets/image4.svg"',
              'src="assets/image5.jpg"': 'src="assets/image5.svg"',
              'src="assets/image6.jpg"': 'src="assets/image6.svg"',
          }
          for old, new in repl.items():
              text = text.replace(old, new)
          text = text.replace('alt="Week One update image 4"', 'alt="Chart of the Week: American children are not allowed to go to many places without an adult."')
          text = text.replace('alt="Week One update image 5"', 'alt="Photo of the Week: Swiss topographic map with secret drawings."')
          text = text.replace('alt="Week One update image 6"', 'alt="Book of the Week: Restoring Childhood by Peter Gray."')
          html_path.write_text(text, encoding='utf-8')

          image1 = '''<svg xmlns="http://www.w3.org/2000/svg" width="624" height="382" viewBox="0 0 624 382"><rect width="624" height="382" fill="#f8f8f8"/><rect x="18" y="22" width="588" height="338" rx="8" fill="#fff" stroke="#d0d0d0"/><rect x="18" y="22" width="588" height="42" rx="8" fill="#242c33"/><text x="38" y="49" font-family="Arial" font-size="15" fill="#fff" font-weight="700">Weekly Assignments and Class Updates 2026</text><g font-family="Arial" fill="#222"><rect x="44" y="93" width="536" height="58" rx="6" fill="#f1f4f7" stroke="#d9e0e7"/><text x="66" y="127" font-size="17" font-weight="700">Grading and Evaluation of Research and Rumination Work</text><rect x="44" y="169" width="536" height="58" rx="6" fill="#f1f4f7" stroke="#d9e0e7"/><text x="66" y="203" font-size="17" font-weight="700">Week Zero Class Updates and Assignments</text><rect x="44" y="245" width="536" height="58" rx="6" fill="#f1f4f7" stroke="#d9e0e7"/><text x="66" y="279" font-size="17" font-weight="700">Week One Class Update and Assignments</text></g></svg>'''
          assets.joinpath('image1.svg').write_text(image1, encoding='utf-8')

          rows = [(4,71,20,6,3,0),(5,62,25,9,3,2),(6,58,28,10,3,0),(7,46,31,18,5,0),(8,39,31,21,8,1),(10,28,30,30,10,2),(12,19,25,31,23,2),(14,11,16,28,36,8),(17,8,8,14,32,39)]
          colors = ['#24106d','#7862b9','#c7bedf','#f2b47f','#bc5b06']
          labels = ['Cannot leave house','Cannot leave yard','Cannot leave street','Cannot leave neighborhood','Can go anywhere']
          parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="624" height="586" viewBox="0 0 624 586">','<rect width="624" height="586" fill="#fffaf2"/>','<text x="32" y="42" font-family="Arial" font-size="24" font-weight="800" fill="#222">American children are not allowed to go to many places</text>','<text x="32" y="70" font-family="Arial" font-size="15" fill="#444">% children at each age allowed to walk, bike, or drive given distance, without an adult</text>']
          lx = [35,190,340,35,260]; ly=[92,92,92,116,116]
          for i,lab in enumerate(labels):
              parts.append(f'<rect x="{lx[i]}" y="{ly[i]}" width="13" height="13" fill="{colors[i]}"/><text x="{lx[i]+20}" y="{ly[i]+12}" font-family="Arial" font-size="13" fill="#222">{html.escape(lab)}</text>')
          y = 155
          scale = 5.5
          for row in rows:
              age, *vals = row
              parts.append(f'<text x="33" y="{y+17}" font-family="Arial" font-size="13" text-anchor="end" fill="#222">{age}</text>')
              x = 55
              for i,v in enumerate(vals):
                  w = v*scale
                  parts.append(f'<rect x="{x}" y="{y}" width="{w}" height="26" fill="{colors[i]}"/>')
                  if v >= 3:
                      fill = '#fff' if i in (0,1,4) else '#222'
                      parts.append(f'<text x="{x+w/2}" y="{y+17}" font-family="Arial" font-size="13" fill="{fill}" text-anchor="middle">{v}</text>')
                  x += w
              y += 33
          parts.append('<text x="32" y="520" font-family="Arial" font-size="13" fill="#555">Source: IFS/Axios Generation Survey of American Family Culture, 2025</text><text x="515" y="548" font-family="Georgia" font-size="22" fill="#654bb0" font-weight="800">family</text><text x="515" y="572" font-family="Georgia" font-size="22" fill="#654bb0" font-weight="800">studies</text></svg>')
          assets.joinpath('image4.svg').write_text(''.join(parts), encoding='utf-8')

          image5 = '''<svg xmlns="http://www.w3.org/2000/svg" width="550" height="341" viewBox="0 0 550 341"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#c9d3d8" stroke-width="1"/></pattern></defs><rect width="550" height="341" fill="#eef3f5"/><rect width="550" height="341" fill="url(#grid)" opacity=".7"/><g fill="none" stroke="#7e969b" stroke-width="1.3" opacity=".75"><path d="M-20 45 C80 10 180 90 285 40 S480 10 570 70"/><path d="M-10 82 C95 42 170 122 292 72 S470 42 570 105"/><path d="M-20 122 C110 82 185 165 300 112 S475 82 575 145"/><path d="M-15 170 C85 130 210 205 316 155 S475 128 570 198"/><path d="M-25 218 C110 182 210 246 332 202 S490 190 575 242"/><path d="M-15 270 C95 232 220 300 340 252 S490 245 565 295"/></g><g transform="translate(330,70) rotate(-20)"><circle cx="45" cy="45" r="58" fill="none" stroke="#b88d39" stroke-width="8"/><circle cx="45" cy="45" r="51" fill="none" stroke="#f7e1a8" stroke-width="3"/><rect x="92" y="96" width="132" height="19" rx="9" fill="#b88d39" stroke="#7a5a22"/><rect x="100" y="100" width="116" height="7" rx="3" fill="#f7e1a8" opacity=".85"/></g><text x="28" y="286" font-family="Georgia" font-size="25" fill="#075cab" font-weight="700">Photo of the Week</text><text x="28" y="313" font-family="Arial" font-size="17" fill="#333">Swiss topographic maps, hidden drawings, and cartographic mischief.</text></svg>'''
          assets.joinpath('image5.svg').write_text(image5, encoding='utf-8')

          image6 = '''<svg xmlns="http://www.w3.org/2000/svg" width="624" height="497" viewBox="0 0 624 497"><rect width="624" height="497" fill="#fff"/><g transform="translate(190,36) skewY(-5)"><rect x="0" y="0" width="250" height="360" rx="8" fill="#102a16" stroke="#222" stroke-width="3"/><rect x="18" y="18" width="214" height="324" rx="6" fill="#1f562e"/><text x="125" y="80" font-family="Arial Black, Impact, sans-serif" font-size="43" fill="#f6ee28" text-anchor="middle">Restoring</text><text x="125" y="130" font-family="Arial Black, Impact, sans-serif" font-size="43" fill="#f6ee28" text-anchor="middle">Childhood</text><text x="125" y="166" font-family="Arial" font-size="17" fill="#fff" font-style="italic" text-anchor="middle">How to Set Kids Free</text><text x="125" y="190" font-family="Arial" font-size="17" fill="#fff" font-style="italic" text-anchor="middle">in the Age of Anxiety</text><circle cx="69" cy="265" r="24" fill="#f16b5b"/><circle cx="125" cy="260" r="24" fill="#6db9e8"/><circle cx="181" cy="266" r="24" fill="#f2dc5d"/><text x="125" y="328" font-family="Arial Black, Impact, sans-serif" font-size="32" fill="#f6ee28" text-anchor="middle">Peter Gray</text></g><text x="312" y="438" font-family="Georgia" font-size="22" fill="#111" text-anchor="middle">What has happened to the freedom our kids used to enjoy?</text></svg>'''
          assets.joinpath('image6.svg').write_text(image6, encoding='utf-8')
          PY
      - name: Commit image restoration
        run: |
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          rm .github/workflows/fix-week-one-images.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore Week One update images"
            git push
          fi
