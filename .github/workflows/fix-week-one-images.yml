name: Fix EWOT Week One Images

on:
  push:
    paths:
      - '.github/workflows/fix-week-one-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Restore image displays
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          base = Path('weekly/ewot/fall-2026/week-01')
          assets = base / 'assets'
          assets.mkdir(parents=True, exist_ok=True)
          html_path = base / 'index.html'
          html = html_path.read_text(encoding='utf-8')

          # Keep the source-copy page, but make the broken converted image slots display.
          html = html.replace('src="assets/image1.jpg"', 'src="assets/image1.svg"')
          html = html.replace('src="assets/image2.jpg"', 'src="../../../../Outside_Hours_Location.png"')
          html = html.replace('src="assets/image3.jpg"', 'src="../../../../poster-files/engerman-hornbeck-after-shocks-poster.png"')
          html = html.replace('src="assets/image4.jpg"', 'src="assets/image4.svg"')
          html = html.replace('src="assets/image5.jpg"', 'src="assets/image5.svg"')
          html = html.replace('src="assets/image6.jpg"', 'src="assets/image6.svg"')
          html = html.replace('alt="Week One update image 4"', 'alt="Chart of the Week: American children are not allowed to go to many places without an adult."')
          html = html.replace('alt="Week One update image 5"', 'alt="Photo of the Week: Swiss topographic map with secret drawings."')
          html = html.replace('alt="Week One update image 6"', 'alt="Book of the Week: Restoring Childhood by Peter Gray."')
          html_path.write_text(html, encoding='utf-8')

