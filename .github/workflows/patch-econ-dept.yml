name: Patch Economics Department Page

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-econ-dept.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Patch econ-dept.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('econ-dept.html')
          s = p.read_text(encoding='utf-8')

          # 1. Update brief Financial Economics major-card summary.
          old_major = '''            <h4>Electives and Allied Fields</h4>
            <ul>
              <li>Three economics electives, including one from a curated advanced list.</li>
              <li>Two allied-field courses across selected finance, accounting, data science, computer science, statistics, math, political science, and business-policy courses.</li>
              <li>Complete calculus sequence.</li>
            </ul>'''
          new_major = '''            <h4>Electives and Allied Fields</h4>
            <ul>
              <li>Three economics electives, one of which must come from the designated Financial Economics economics-elective list.</li>
              <li>One of the economics electives must be taken for W credit.</li>
              <li>Two allied-field electives from the designated pool. The two allied-field electives do not need to be from the same field.</li>
              <li>Complete calculus sequence.</li>
            </ul>'''
          s = s.replace(old_major, new_major)

          # 2. Update transition/statistics note.
          old_transition = '''Calculus classes are pre-major requirements and are not subject to overlap requirements. Statistics classes will be subject to standard overlap rules. In special cases, ECON 232 may substitute for ECON 230. Class of 2027, 2028 and 2029 students who have already declared the BA in Econ or Financial Economics may continue in those degree paths. All Class of 2030 students and current undeclared underclassmen will choose from our three new major offerings.'''
          new_transition = '''Calculus classes are pre-major requirements and are not subject to overlap requirements. Statistics classes will be subject to standard overlap rules. ECON 230 is the standard statistics path, but there are additional approved pathways in some cases, including AP Statistics credit plus STAT 181, the Statistics Program bridging module; the STAT 181/182 pathway where applicable; and, for some Political Science double majors, the PSCI 200 Data Analysis I plus PSCI 205 Data Analysis II sequence. In special cases, ECON 232 may substitute for ECON 230. Class of 2027, 2028 and 2029 students who have already declared the BA in Econ or Financial Economics may continue in those degree paths. All Class of 2030 students and current undeclared underclassmen will choose from our three new major offerings.'''
          s = s.replace(old_transition, new_transition)

          # 3. Add a discreet statistics note under the course-options warning, if not already present.
          old_note = '''<p><strong>Important:</strong> These are student-facing planning lists built from the proposal documents, not the official registrar. Course numbers, titles, and final elective pools should be checked against the official department website before a student makes a graduation plan.</p>'''
          new_note = old_note + '''
          <p style="margin-top:10px;"><strong>Statistics note:</strong> ECON 230 remains the ordinary path for satisfying the economics statistics requirement. Additional pathways may be approved in particular cases, including AP Statistics credit plus STAT 181, the Statistics Program bridging module; the STAT 181/182 pathway where applicable; and, for some Political Science double majors, PSCI 200 Data Analysis I plus PSCI 205 Data Analysis II. Students should verify approval before assuming a substitute satisfies the major.</p>'''
          if 'Statistics note:</strong> ECON 230 remains the ordinary path' not in s:
              s = s.replace(old_note, new_note)

          # 4. Update Financial Economics course-options block.
          pattern = re.compile(r'''          <article class="course-option-card fin" id="fe-course-options">.*?          </article>''', re.S)
          new_fe = '''          <article class="course-option-card fin" id="fe-course-options">
            <h3>BS in Financial Economics</h3>
            <p><span class="tag orange">Finance, institutions, and economics</span><span class="tag">14 major courses</span></p>

            <h4>Pre-major calculus sequence</h4>
            <ul>
              <li>MATH 141, 142</li>
              <li>MATH 161, 162</li>
              <li>MATH 171, 172</li>
            </ul>

            <h4>Economics core</h4>
            <ul>
              <li>ECON 108 — Principles of Economics</li>
              <li>ECON 207 — Intermediate Microeconomics</li>
              <li>ECON 209 — Intermediate Macroeconomics</li>
              <li>ECON 230 — Economic Statistics, or approved statistics pathway</li>
              <li>ECON 231W — Econometrics</li>
            </ul>

            <h4>Finance-accounting core</h4>
            <ul>
              <li>FIN 205 — Managerial Finance</li>
              <li>FIN 206 — Investments</li>
              <li>ACC 201 — Accounting</li>
              <li>ECON 211 — Money, Banking, and Credit / Modern Financial Institutions</li>
            </ul>

            <h4>Economics electives</h4>
            <ul>
              <li>Three economics electives.</li>
              <li>One of the three must come from the designated Financial Economics economics-elective list below.</li>
              <li>One of the economics electives must be taken for W credit.</li>
            </ul>

            <h4>Financial Economics economics-elective list: choose one</h4>
            <ul>
              <li>ECON 219 — Advanced Macroeconomics</li>
              <li>ECON 223 — Labor Economics</li>
              <li>ECON 233W — Financial Econometrics</li>
              <li>ECON 263 — Public Finance</li>
              <li>ECON 268 — Globalization</li>
              <li>ECON 269 — International Trade</li>
              <li>ECON 270 — International Macroeconomics</li>
              <li>ECON 275 — Developmental Economics</li>
              <li>ECON 277 — Financial Crises</li>
            </ul>

            <h4>Allied-field electives: choose two</h4>
            <p>The two allied-field electives are not required to be from the same field.</p>

            <h4>Finance and accounting</h4>
            <ul>
              <li>ACC 221 — Managerial Accounting</li>
              <li>ACC 222 — Financial Statements</li>
              <li>FIN 213 — Corporate Finance</li>
              <li>FIN 224 — Options, Futures, and Derivatives</li>
              <li>FIN 242 — International Finance</li>
              <li>FIN 246 — Cryptocurrencies, Blockchain, and FinTech</li>
            </ul>

            <h4>Data and computer science, information systems</h4>
            <ul>
              <li>CSC 161 — Intro Programming (Python)</li>
              <li>CSC 171 — Introduction to Computer Science</li>
              <li>CSC 242 — Artificial Intelligence</li>
              <li>CSC 246 — Machine Learning</li>
              <li>DSCC 201 — Tools for Data Science</li>
              <li>CSC/DSCC 240 — Data Mining</li>
              <li>CSC/DSCC 261 — Database Systems</li>
              <li>CIS 191 — Python and Analytics</li>
              <li>CIS 211 — Modeling with Excel</li>
              <li>CIS 220 — Business Information Systems</li>
              <li>CIS 240 — Database Management</li>
              <li>CIS 242 — Predictive Analytics</li>
              <li>CIS 279 — AI and Business Applications</li>
            </ul>

            <h4>Mathematics and statistics</h4>
            <ul>
              <li>MATH 201 — Probability</li>
              <li>MATH 202 — Stochastic Processes</li>
              <li>MATH 208 — Operations Research</li>
              <li>MATH 210 — Financial Mathematics</li>
              <li>MATH 233 — Math Cryptography</li>
              <li>STAT 211 — Sampling Techniques</li>
              <li>STAT 223 — Bayesian Inference</li>
            </ul>

            <h4>Political science, other</h4>
            <ul>
              <li>PSCI 238 — Business and Politics</li>
              <li>PSCI 244 — Politics and Markets</li>
              <li>PSCI 247 — Green Markets</li>
              <li>LAW 205 — Business Law</li>
            </ul>
          </article>'''
          s, n = pattern.subn(new_fe, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected to replace one FE course-options block, replaced {n}')

          # 5. Update declaration checklist language.
          s = s.replace('For the BS and Financial Economics proposals this includes ECON 108, ECON 207, ECON 209, ECON 230 or equivalent, and one semester of calculus.',
                        'For the BS and Financial Economics proposals this includes ECON 108, ECON 207, ECON 209, ECON 230 or an approved statistics pathway, and one semester of calculus.')

          # 6. Update FAQ PSC wording to newer PSCI naming.
          s = s.replace('Can PSC 200 and PSC 205 satisfy the statistics requirement?',
                        'Can PSCI 200 and PSCI 205 satisfy the statistics requirement?')
          s = s.replace('Students who complete both PSC 200 and PSC 205 can receive credit for satisfying the Economics statistics requirement.',
                        'Some students, especially approved Political Science double majors, may satisfy the Economics statistics requirement by completing both PSCI 200 Data Analysis I and PSCI 205 Data Analysis II. Students should confirm approval before relying on this pathway.')
          s = s.replace('<span class="tag blue">PSC 200 / PSC 205</span>', '<span class="tag blue">PSCI 200 / PSCI 205</span>')
          s = s.replace('data-tags="PSC 200 PSC 205 statistics requirement political science"',
                        'data-tags="PSCI 200 PSCI 205 statistics requirement political science data analysis"')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit changes
        run: |
          rm .github/workflows/patch-econ-dept.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add econ-dept.html .github/workflows/patch-econ-dept.yml
          git commit -m "Update Financial Economics BS and statistics pathways" || exit 0
          git push
