name: Patch Financial Economics Major Summary

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-econ-major-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Patch FE summary block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('econ-dept.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'''          <article class="major-card fin">.*?            <a class="mini-link" href="#fe-course-options">See Financial Economics required courses and elective menu</a>\n          </article>''', re.S)
          replacement = '''          <article class="major-card fin">
            <h3>BS in Financial Economics</h3>
            <p><span class="tag orange">Finance + economics</span><span class="tag blue">STEM-style training</span></p>

            <h4>Economics Core</h4>
            <ul>
              <li>ECON 108, 207, 209</li>
              <li>ECON 230 or approved statistics pathway</li>
              <li>ECON 231W</li>
            </ul>

            <h4>Financial Economics Core</h4>
            <ul>
              <li>FIN 205</li>
              <li>FIN 206</li>
              <li>ACC 201</li>
              <li>ECON 211: Money, Credit, and Modern Financial Institutions</li>
            </ul>

            <h4>Electives and Allied Fields</h4>
            <ul>
              <li>Three economics electives, one from the designated Financial Economics economics-elective list.</li>
              <li>One of the economics electives must be taken for W credit.</li>
              <li>Two allied-field electives from the designated pool; they do not need to be from the same field.</li>
              <li>Complete calculus sequence.</li>
            </ul>

            <a class="mini-link" href="#fe-course-options">See Financial Economics required courses and elective menu</a>
          </article>'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one FE major-card replacement, got {n}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit changes
        run: |
          rm .github/workflows/patch-econ-major-summary.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add econ-dept.html .github/workflows/patch-econ-major-summary.yml
          git commit -m "Update Financial Economics major summary" || exit 0
          git push
