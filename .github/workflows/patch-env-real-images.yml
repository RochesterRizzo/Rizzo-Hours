name: Patch Environmental Week One Real Images

on:
  push:
    paths:
      - '.github/workflows/patch-env-real-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Patch image URLs
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('weekly/environmental-economics/fall-2026/week-01/index.html')
          html = p.read_text(encoding='utf-8')
          replacements = {
            'https://commons.wikimedia.org/wiki/Special:FilePath/Dublin_-_Marsh%27s_Library_-_20230428135752.jpg': 'https://img.atlasobscura.com/w25EoWiTS43gb5Ge6mgd2frq_DIB1YBBYq8XQC7-wtM/rs%3Afill%3A12000%3A12000/q%3A81/sm%3A1/scp%3A1/ar%3A1/aHR0cHM6Ly9hdGxh/cy1kZXYuczMuYW1h/em9uYXdzLmNvbS91/cGxvYWRzL2Fzc2V0/cy9iYWYyZTQ5MGZh/YWI2OWYyZDdfZWE3/MjFjN2UwMDQ4OTg3/OWZmX2ZpbGVzX2Zp/Y2hpZXJfMTI5OTlf/YW50d2VycGVuLWhl/cml0YS1ib2VrZW50/b2lsZXQtYy1lbW1h/bnVlbC1kZS1wcnlj/a2VyLmpwZw.jpg',
            'https://nationalzoo.si.edu/sites/default/files/styles/1400x700_scale_and_crop/public/media/image/elephant-trails-aerial-view.jpg': 'https://www.nps.gov/lecl/learn/nature/images/montage-1b_2.jpg',
            'https://nationalzoo.si.edu/sites/default/files/media/image/lewis_clark_resurvey_image_three.jpg': 'https://www.nps.gov/lecl/learn/nature/images/montage-1b_2.jpg'
          }
          changed = False
          for old, new in replacements.items():
              if old in html:
                  html = html.replace(old, new)
                  changed = True
          if not changed:
              print('No matching old URLs found; writing no semantic changes')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/patch-env-real-images.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add -A
          git commit -m "Use source images in Environmental Week One page" || exit 0
          git push
