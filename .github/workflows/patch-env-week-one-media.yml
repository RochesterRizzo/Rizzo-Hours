name: Patch Environmental Week One Media

on:
  push:
    paths:
      - '.github/workflows/patch-env-week-one-media.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Patch media srcs
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('weekly/environmental-economics/fall-2026/week-01/index.html')
          html = p.read_text(encoding='utf-8')
          repl = {
            'assets/image01.jpg':'../../../../Outside_Hours_Location.png',
            'assets/image02.jpg':'../../../../poster-files/engerman-hornbeck-after-shocks-poster.png',
            'assets/image03.jpg':'https://ourworldindata.org/grapher/cumulative-area-burnt-by-wildfires-last-year.svg?time=2026&country=~Europe%20%28excluding%20Russia%29',
            'assets/image04.jpg':'https://ourworldindata.org/grapher/cumulative-area-burnt-by-wildfires-last-year.svg?time=2026&country=FRA~ESP~DEU~PRT~GBR~ITA',
            'assets/image05.jpg':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Marsh%27s_Library%2C_Dublin%2C_Ireland_%2852532609306%29.jpg',
            'assets/image06.jpg':'https://nationalzoo.si.edu/sites/default/files/styles/1400x700_scale_and_crop/public/media/image/elephant-trails-aerial-view.jpg',
          }
          for a,b in repl.items():
              html = html.replace(a,b)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/patch-env-week-one-media.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add weekly/environmental-economics/fall-2026/week-01/index.html .github/workflows/patch-env-week-one-media.yml
          git commit -m "Patch Environmental Week One media paths"
          git push
