name: Patch EWOT Week One Attention Links

on:
  push:
    paths:
      - '.github/workflows/patch-week-one-attention.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Restore full Week One attention section and quote title
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, zlib, base64
          p = Path('weekly/ewot/fall-2026/week-01/index.html')
          html = p.read_text(encoding='utf-8')
          section = zlib.decompress(base64.b64decode("""""")).decode('utf-8')
          html, n = re.subn(r'<section class="issue-section source-update" id="attention">.*?</section>', section, html, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected to replace one attention section, replaced {n}')
          html = html.replace('<li><a href="#quote">The Meaning of an Education</a></li>', '<li><a href="#quote">Quote of the Week</a></li>')
          html = html.replace('<h2>The Meaning of an Education</h2>', '<h2>Quote of the Week</h2>')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/patch-week-one-attention.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add weekly/ewot/fall-2026/week-01/index.html .github/workflows/patch-week-one-attention.yml
          git commit -m "Restore EWOT Week One attention links"
          git push
