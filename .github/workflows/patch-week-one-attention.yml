name: Patch EWOT Week One Attention Links

on:
  push:
    paths:
      - '.github/workflows/patch-week-one-attention.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Patch attention and quote sections
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap
          p = Path('weekly/ewot/fall-2026/week-01/index.html')
          html = p.read_text(encoding='utf-8')
          section = textwrap.dedent(r'''
            <section class="issue-section source-update" id="attention">
              <h2>Some Items That Caught Our Attention</h2>
              <p><strong>Wanna Get An A?</strong> <a href="https://academic.oup.com/sleep/advance-article-abstract/doi/10.1093/sleep/zsae062/7619522?login=false&utm_source=substack&utm_medium=email" target="_blank" rel="noopener noreferrer">Try this</a>.</p>
              <p><strong>Wanna Get An A?</strong> <a href="https://www.nber.org/papers/w32550?utm_campaign=ntwh&utm_medium=email&utm_source=ntwg19" target="_blank" rel="noopener noreferrer">Try this too</a>,</p>
              <p><strong>Minimum Wages are Not Magic Wands, Episode 38775782:</strong> “<a href="https://www.nber.org/papers/w35628" target="_blank" rel="noopener noreferrer">We find adverse – rather than beneficial –</a> effects of minimum wages on the employment, hours, and earnings of initially-employed low-wage workers in poor and low-income families. … the adverse effects for poor and low-income low-wage workers <strong>help explain why minimum wages do not reduce poverty.</strong>”</p>
              <p><strong>Ban Data Centers …</strong> <a href="https://www.noahpinion.blog/p/banning-data-centers-would-blow-up" target="_blank" rel="noopener noreferrer">and blow up the economy</a>: “The big danger is that data center bans will choke off the main engine of U.S. growth, throwing a lot of Americans out of their jobs and putting a hole in Americans’ retirement savings. But before I talk about that, I should talk about why I think limitations on data centers aren’t actually a crazy idea. …”</p>
              <p><strong>Do You Need to Be a Billionaire to Live Your Dreams?</strong> “<a href="https://kk.org/thetechnium/a-billion-dollars/?ref=thebrowser.com" target="_blank" rel="noopener noreferrer">I am reminded of a scene in the movie Wall Street</a> where Bud, the protagonist, is working in a high-paying finance job he hates so that he can make a million dollars, retire and ride a motorcycle across China. The inside joke is that you don’t need to work on Wall Street, or to make a million dollars, to buy a motorcycle to cross China. You could easily do that whole trip for $2,000 dollars, saved from a short summer stint working at Costco … The bottleneck for most dreams is not financial. It’s a lack of confidence, willingness to take a risk, and face failure, or a lack of imagination of what is possible with current resources. If you want to write a novel you don’t need capital — you need discipline and 1,000 words a day. If you want to start a consultancy you need expertise and a first client, not a war chest. A lack of money is a convenient thing to blame because it feels concrete, but it’s rarely the actual blocker for achievements.”</p>
              <p>“Bloomberg reports <strong>over a quarter of Gen-Z investors consider sports betting part of their long-term financial strategy,</strong> with 52% apparently moving their investment funds into sports bets. Ah yes, the new investment strat known as “DraftKings.” Now, you might not be shocked to find out that placing 6-leg parlays isn’t a sound substitute for investing in blue-chip stocks.<strong>”</strong></p>
              <p><strong>Building</strong> <a href="https://www.piratewires.com/p/cameron-schiller-rangeview-el-segundo-manufacturing" target="_blank" rel="noopener noreferrer"><strong>at 26</strong></a></p>
              <p><strong>Legal Plunder, Gavin Newsome and Poop Diapers:</strong> Any sufficiently evolved regulatory regime will devolve into a system of legal plunder backed by a system of faux morality used to disguise it as safety and justice. Who could be against having newborns get diapers, do you hate babies? I must, because this is not access, this is theft. baby2baby, the nonprofit set to guzzle this largesse on a no bid/no shop contract is run by norah wienstein who sits on the board of california partners project with, wait for it, jennifer siebel newsom. and the costs are multiples of what you’d pay on amazon or costco. <a href="https://x.com/realpeteyb123/status/2052921811998765526?s=46&t=rP_x4WxKKRnOl80Iz5e13g" target="_blank" rel="noopener noreferrer">it’s legal plunder to favor a crony</a>. California is about to spend $20 million of taxpayer money to give 100,000 newborns 400 diapers each through Baby2Baby.</p>
              <p>Do the math with me:<br>100,000 babies × 400 diapers = 40 million diapers<br>$20,000,000 ÷ 40,000,000 = $0.50 per diaper!!!!!</p>
              <p>Now walk into any Costco in California and you can buy the same quality diapers for .12 to .15 cents each! That’s $48 to $60 for 400 diapers. So the state is paying 8–10x more per diaper than a regular family buying in bulk. They could’ve just handed every low-income new mom $100 cash and told her to go to Costco. She’d get more diapers, better ones if she wanted, and still have money left for formula, wipes, or whatever the hell she actually needs. But nah… that wouldn’t let Gavin and his connected “nonprofit” girls running the show there cut ribbons, take photos, do galas and be friends with celebrities and brag about the “first-in-the-nation” program while skimming their cut for “administration” and “partnerships.”</p>
              <p><strong>Not on Your Bingo Card?</strong> “<a href="https://www.nber.org/papers/w35193" target="_blank" rel="noopener noreferrer">Our results show</a> that within a socioeconomically vulnerable population, Black adults outlive Whites.”</p>
              <p><strong>Someone Else Should Pay I Guess:</strong> “When asked if they would support just a $1 monthly fee on their electricity bill to fight climate change, only 47 percent say they would while almost as many (43 percent) are opposed. Even at this level, opposition is greater than support among working-class voters. When the proposed fee is increased to $20, overall voter support plummets to 26 percent with 60 percent opposed. At $40, it is 19 percent support to 69 percent opposition; at $75 it is 15 percent vs. 72 percent; and at $100 it is 7:1 against (77 percent to 11 percent) paying such a fee to combat climate change.”</p>
              <p><strong>The Gals are Superior, Jigsaw Puzzle Edition:</strong> “recently learned about the world jigsaw puzzle championship, which is the first sport i've found where mixed genders compete and men do okay <a href="https://x.com/coldhealing/status/1839313069639610810?t=qTZ8EwC5G3DzFjV7Xbzcjw&s=03" target="_blank" rel="noopener noreferrer">but women usually win.</a>“</p>
              <p><strong>In China,</strong> <a href="https://x.com/berthofmanecon/status/1837296838052913547?utm_source=substack&utm_medium=email" target="_blank" rel="noopener noreferrer">the smarter you are</a>, <strong>the LESS entrepreneurial you are</strong></p>
              <p><strong>Are Robots and</strong> <a href="https://splittinginfinity.substack.com/p/tech-im-skeptical-of-and-why" target="_blank" rel="noopener noreferrer"><strong>Asteroid Mining Overrated</strong></a>?</p>
              <p><strong>Against Brokenist Economics:</strong> “<a href="https://www.noahpinion.blog/p/americas-political-economy-is-pretty" target="_blank" rel="noopener noreferrer">Roughly speaking</a>, we have three major political movements — the MAGA right, the socialist left, and the “woke” left. But none of these seems especially interested in the kind of smart, reasonable policies that would significantly improve the material well-being of regular Americans. Their economic programs are all pretty bad.”</p>
              <p><strong>JEP Symposium</strong> <a href="https://www.aeaweb.org/issues/857?to=19958" target="_blank" rel="noopener noreferrer">on Tariff Economics</a></p>
              <p><strong>So, Are We Leaving the Labor Force or Not?</strong> A <a href="https://everywheremillionaire.substack.com/p/another-reason-the-labor-share-keeps?utm_source=substack&utm_medium=email" target="_blank" rel="noopener noreferrer">revisionist take</a> on whether the labor force participation rate is really falling, or whether it is a relic of statistical and tax policy (not unlike the Tax Act of 1986).</p>
              <p><strong>The Free-Market Success of …</strong> “<a href="https://brandondonnelly.com/the-market-logic-of-japanese-rail?utm_source=substack&utm_medium=email" target="_blank" rel="noopener noreferrer">The Japanese rail</a> model seems to work so well because (1) most of the network is private, (2) liberal land-use policies have allowed Japan's urban centres to develop enough density to properly support the use of rail, and (3) the rail operators make money in a bunch of other ways beyond rail. They're typically also in the business of real estate.”</p>
              <p><strong>The End of Universities:</strong> “The problems cited in the report will be familiar to readers of The Free Press, as they include nontransparent admissions standards, grade inflation, a culture that forces self-censorship, and outrageous tuition pricing. This year, George Washington University—hardly in the top tier of selective schools—started charging a sticker price approaching $100,000 a year for the privilege of studying there.” "I’d like to make some predictions about how higher education in America is going to muddle through. The bottom line is that it will not be pretty, or for that matter efficient, but 20 years from now, the basic product will still be recognizable. You will not be happy with it, and it will not be happy with you. We will all still be talking about it, because it will remain a major mechanism for doling out good jobs, mating opportunities, and social status. …Since our institutions of higher education are so imperfect to begin with, that gives them a kind of robustness. They can get a bit worse without it ending the world or ruining the next generation. Society will advance in other ways." <a href="https://www.thefp.com/p/tyler-cowen-college-wont-get-fixed" target="_blank" rel="noopener noreferrer">Have a nice day</a>.</p>
              <p style="text-align:center">* * * * *</p>
            </section>
          ''')
          pattern = r'<section[^>]*id="attention"[^>]*>[\s\S]*?</section>'
          html, n = re.subn(pattern, section, html, count=1)
          if n != 1:
              raise SystemExit(f'attention replacement failed: {n}')
          html = html.replace('<li><a href="#quote">The Meaning of an Education</a></li>', '<li><a href="#quote">Quote of the Week</a></li>')
          html = html.replace('<h2>The Meaning of an Education</h2>', '<h2>Quote of the Week</h2>')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/patch-week-one-attention.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add weekly/ewot/fall-2026/week-01/index.html .github/workflows/patch-week-one-attention.yml
          git commit -m "Restore EWOT Week One attention links"
          git push
