name: Patch EWOT Week One Inline Images

on:
  push:
    paths:
      - '.github/workflows/patch-week-one-inline-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Insert Week One images directly into page
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('weekly/ewot/fall-2026/week-01/index.html')
          html = p.read_text(encoding='utf-8')
          css = """    .week-image { margin: 18px 0; }
              .week-image img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
              .week-image.narrow { max-width: 360px; }
              .week-image.medium { max-width: 560px; }
              .week-image.wide { max-width: 720px; }
          """
          if '.week-image {' not in html:
              html = html.replace('</style>', css + '\n  </style>')
          image_section = '''
          <section class="issue-section" id="images-restored">
            <h2>Images and Visuals from This Update</h2>
            <figure class="week-image wide" id="bb-week-one-assignment-image">
              <img src="assets/image1.svg" alt="Blackboard screenshot showing Weekly Assignments and Class Updates 2026, including Week One Class Update and Assignments.">
            </figure>
            <figure class="week-image wide" id="outside-hours-map-image">
              <img src="../../../../Outside_Hours_Location.png" alt="Map showing the outdoor office hours location near Meliora Hall.">
            </figure>
            <figure class="week-image narrow" id="engerman-poster-image">
              <img src="../../../../poster-files/engerman-hornbeck-after-shocks-poster.png" alt="Poster for Richard Hornbeck, After Shocks: Adaptation and Growth through Volatile Times, Engerman Lecture.">
            </figure>
            <figure class="week-image wide" id="chart-of-week-image">
              <img src="assets/image4.svg" alt="Chart of the Week: American children are not allowed to go to many places without an adult.">
            </figure>
            <figure class="week-image medium" id="photo-of-week-image">
              <img src="assets/image5.svg" alt="Photo of the Week: Swiss topographic map with hidden drawings.">
            </figure>
            <figure class="week-image narrow" id="book-video-week-image">
              <img src="assets/image6.svg" alt="Book of the Week: Restoring Childhood by Peter Gray.">
            </figure>
          </section>
          '''
          if 'id="images-restored"' not in html:
              html = html.replace('</article>', image_section + '\n      </article>', 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/patch-week-one-inline-images.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add weekly/ewot/fall-2026/week-01/index.html .github/workflows/patch-week-one-inline-images.yml
          git commit -m "Insert EWOT Week One images directly into page"
          git push
