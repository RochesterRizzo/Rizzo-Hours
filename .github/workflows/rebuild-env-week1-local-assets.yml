name: Rebuild Environmental Week One Local Assets

on:
  push:
    paths:
      - '.github/workflows/rebuild-env-week1-local-assets.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Localize Week One images and patch updated source text
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re, shutil, urllib.request

          page = Path('weekly/environmental-economics/fall-2026/week-01/index.html')
          assets = Path('weekly/environmental-economics/fall-2026/week-01/assets')
          assets.mkdir(parents=True, exist_ok=True)

          # Preserve existing source assets already used elsewhere on the site.
          shutil.copyfile('Outside_Hours_Location.png', assets / 'figure-01-office-map.png')
          shutil.copyfile('poster-files/engerman-hornbeck-after-shocks-poster.png', assets / 'figure-02-engerman-poster.png')

          downloads = {
              'figure-03-wildfires-europe.png': 'https://ourworldindata.org/grapher/cumulative-area-burnt-by-wildfires-last-year.png?time=2026&country=~Europe%20%28excluding%20Russia%29',
              'figure-04-wildfires-comparison.png': 'https://ourworldindata.org/grapher/cumulative-area-burnt-by-wildfires-last-year.png?time=2026&country=FRA~ESP~DEU~PRT~GBR~ITA',
              # Source image from the Book toilets item. Download locally so the page never hotlinks it.
              'figure-05-book-toilets.jpg': 'https://img.atlasobscura.com/w25EoWiTS43gb5Ge6mgd2frq_DIB1YBBYq8XQC7-wtM/rs:fill:12000:12000/q:81/sm:1/scp:1/ar:1/aHR0cHM6Ly9hdGxhcy1kZXYuczMuYW1hem9uYXdzLmNvbS91cGxvYWRzL2Fzc2V0cy9iYWYyZTQ5MGZhYWI2OWYyZDdfZWE3MjFjN2UwMDQ4OTg3OWZmX2ZpbGVzX2ZpY2hpZXJfMTI5OTlfYW50d2VycGVuLWhlcml0YS1ib2VrZW50b2lsZXQtYy1lbW1hbnVlbC1kZS1wcnlja2VyLmpwZw.jpg',
              # Source image used for the Lewis and Clark nature item.
              'figure-06-lewis-clark-nature.jpg': 'https://www.nps.gov/lecl/learn/nature/images/montage-1b_2.jpg',
          }
          opener = urllib.request.build_opener()
          opener.addheaders = [('User-Agent', 'Mozilla/5.0 Rizzo-Hours publisher')]
          for filename, url in downloads.items():
              data = opener.open(url, timeout=45).read()
              if len(data) < 5000:
                  raise RuntimeError(f'{filename} download too small: {len(data)} bytes')
              (assets / filename).write_bytes(data)

          html = page.read_text(encoding='utf-8')
          html = html.replace('@Riz20', '@wintercow20')

          local_srcs = [
              'assets/figure-01-office-map.png',
              'assets/figure-02-engerman-poster.png',
              'assets/figure-03-wildfires-europe.png',
              'assets/figure-04-wildfires-comparison.png',
              'assets/figure-05-book-toilets.jpg',
              'assets/figure-06-lewis-clark-nature.jpg',
          ]
          i = 0
          def repl(match):
              global i
              if i >= len(local_srcs):
                  return match.group(0)
              out = match.group(1) + local_srcs[i] + match.group(2)
              i += 1
              return out
          html = re.sub(r'(<img class="doc-image" src=")[^"]*(")', repl, html)
          if i != 6:
              raise RuntimeError(f'Expected 6 doc images; patched {i}')
          if '@wintercow20' not in html:
              raise RuntimeError('Updated Venmo address not found after patch')
          if 'img.atlasobscura.com' in html or 'nationalzoo.si.edu' in html:
              raise RuntimeError('Remote substitute image URL still present')
          page.write_text(html, encoding='utf-8')
          PY

      - name: Commit rebuilt local assets and remove workflow
        run: |
          rm -f .github/workflows/rebuild-env-week1-local-assets.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add -A weekly/environmental-economics/fall-2026/week-01 .github/workflows/rebuild-env-week1-local-assets.yml
          git commit -m "Rebuild Environmental Week One with local images"
          git push
