name: Sync SHOW ME topics

on:
  push:
    paths:
      - 'show_me_claim_tool_deploy/app/topics.json'
      - '.github/workflows/show-me-bootstrap.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync topic list
        run: cp show_me_claim_tool_deploy/app/topics.json show-me/topics.json

      - name: Save topic list
        run: |
          if ! git diff --quiet -- show-me/topics.json; then
            git config user.name "SHOW ME Topic Bot"
            git config user.email "show-me-topic-bot@users.noreply.github.com"
            git add show-me/topics.json
            git commit -m "Refresh SHOW ME topic list"
            git push origin HEAD:main
          fi
