name: SHOW ME Museum submissions

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: show-me-museum-submissions
  cancel-in-progress: false

jobs:
  process:
    if: startsWith(github.event.issue.title, 'MUSEUM SUBMISSION')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and process exhibit
        run: python show-me/museum/process_submission.py

      - name: Save Museum database
        run: |
          if ! git diff --quiet -- show-me/museum/submissions.json; then
            git config user.name "SHOW ME Museum Bot"
            git config user.email "show-me-museum-bot@users.noreply.github.com"
            git add show-me/museum/submissions.json
            git commit -m "Update SHOW ME Museum"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Post receipt and close submission
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          MESSAGE=$(python -c "import json; print(json.load(open('show-me/museum/request-result.json'))['message'])")
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          gh issue close "$ISSUE_NUMBER"
