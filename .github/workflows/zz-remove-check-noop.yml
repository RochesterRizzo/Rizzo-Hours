name: ZZ Remove Check Noop

on:
  push:
    paths:
      - '.github/workflows/zz-remove-check-noop.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -f .github/workflows/zz-check-do-not-run.yml .github/workflows/zz-remove-check-noop.yml
          git config user.name "RochesterRizzo"
          git config user.email "rizzo.liberty@gmail.com"
          git add .github/workflows
          git commit -m "Remove noop check workflow" || exit 0
          git push
