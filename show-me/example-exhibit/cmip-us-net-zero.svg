<g>
<circle cx="92" cy="527" r="7" fill="#000000"/>
<circle cx="1090" cy="269" r="7" fill="#0a67b1"/><circle cx="1090" cy="313" r="7" fill="#ff7600"/>
<circle cx="1090" cy="173" r="7" fill="#11832d"/><circle cx="1090" cy="213" r="7" fill="#e32323"/>
</g>

<!-- legend -->
<rect x="115" y="142" width="415" height="118" rx="8" fill="#ffffff" stroke="#aeb8c3"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1f2937">
<line x1="135" y1="168" x2="190" y2="168" stroke="#0a67b1" stroke-width="5"/><circle cx="163" cy="168" r="6" fill="#0a67b1"/><text x="205" y="174">CMIP7 Medium (current-policy path)</text>
<line x1="135" y1="194" x2="190" y2="194" stroke="#ff7600" stroke-width="5" stroke-dasharray="12 8"/><circle cx="163" cy="194" r="6" fill="#ff7600"/><text x="205" y="200">Medium if U.S. reaches net-zero</text>
<line x1="135" y1="220" x2="190" y2="220" stroke="#11832d" stroke-width="5"/><circle cx="163" cy="220" r="6" fill="#11832d"/><text x="205" y="226">CMIP7 High (worst-case / policy rollback)</text>
<line x1="135" y1="246" x2="190" y2="246" stroke="#e32323" stroke-width="5" stroke-dasharray="12 8"/><circle cx="163" cy="246" r="6" fill="#e32323"/><text x="205" y="252">High if U.S. reaches net-zero</text>
</g>

<!-- annotations -->
<g font-family="Arial,Helvetica,sans-serif">
<text x="110" y="478" font-size="20" font-weight="700" fill="#111827">1.33°C</text>
<text x="110" y="499" font-size="16" fill="#111827">in 2025</text>
<line x1="110" y1="505" x2="97" y2="523" stroke="#111827" stroke-width="2"/>
<text x="1105" y="177" font-size="20" font-weight="700" fill="#11832d">3.45°C</text>
<text x="1105" y="217" font-size="20" font-weight="700" fill="#e32323">3.28°C</text>
<text x="1105" y="273" font-size="20" font-weight="700" fill="#0a67b1">2.65°C</text>
<text x="1105" y="317" font-size="20" font-weight="700" fill="#ff7600">2.51°C</text>
</g>

<!-- takeaway box -->
<rect x="20" y="675" width="620" height="118" rx="12" fill="#effaf3" stroke="#74b98b"/>
<text x="45" y="709" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#0b5f2b">Main takeaway:</text>
<text x="45" y="738" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#17212b">If the rest of the world does not change course, U.S. net-zero alone</text>
<text x="45" y="764" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#17212b">lowers end-of-century warming by a small amount — about 0.1 to 0.2°C.</text>

<rect x="660" y="675" width="520" height="118" rx="12" fill="#f2f7fd" stroke="#76a7da"/>
<text x="685" y="709" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#0b4f84">Scenario meaning</text>
<text x="685" y="738" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#17212b">Medium = closest CMIP7 analog to a current-policy path</text>
<text x="685" y="763" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#17212b">High = high-emissions / policy-rollback path</text>
<text x="18" y="813" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#667085">Illustrative back-of-the-envelope estimate, not an official CMIP7 model run.</text>
</svg>