<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#ffffff"/>
<rect x="8" y="8" width="1184" height="94" rx="12" fill="#163f6d"/>
<text x="132" y="50" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">If the U.S. went net-zero, how much would global warming change?</text>
<text x="132" y="81" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#d9e7f6">Illustrative CMIP7 comparison assuming the rest of the world stays on the same path</text>
<circle cx="69" cy="55" r="33" fill="#55a9db"/>
<path d="M50 42c8-14 26-18 38-8 10 8 14 22 7 35-7 12-22 18-35 12-15-7-20-25-10-39z" fill="#58aa63"/>
<path d="M64 29c4 7 1 13-5 17 9 2 11 9 9 14 6-3 12-2 15 3 2-10 8-16 16-19-8-10-21-16-35-15z" fill="#b7d26c"/>

<!-- plotting area -->
<line x1="92" y1="592" x2="1090" y2="592" stroke="#1f2937" stroke-width="2"/>
<line x1="92" y1="130" x2="92" y2="592" stroke="#1f2937" stroke-width="2"/>
<g stroke="#d9e0e7" stroke-width="1" stroke-dasharray="4 4">
