<line x1="92" y1="207" x2="1090" y2="207"/><line x1="92" y1="130" x2="1090" y2="130"/>
<line x1="198" y1="130" x2="198" y2="592"/><line x1="326" y1="130" x2="326" y2="592"/>
<line x1="454" y1="130" x2="454" y2="592"/><line x1="582" y1="130" x2="582" y2="592"/>
<line x1="710" y1="130" x2="710" y2="592"/><line x1="838" y1="130" x2="838" y2="592"/>
<line x1="966" y1="130" x2="966" y2="592"/>
</g>

<g font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937">
<text x="60" y="598">1.0</text><text x="60" y="521">1.5</text><text x="60" y="444">2.0</text>
<text x="60" y="367">2.5</text><text x="60" y="290">3.0</text><text x="60" y="213">3.5</text><text x="60" y="136">4.0</text>
<text x="72" y="620">2025</text><text x="176" y="620">2030</text><text x="304" y="620">2040</text>
<text x="432" y="620">2050</text><text x="560" y="620">2060</text><text x="688" y="620">2070</text>
<text x="816" y="620">2080</text><text x="944" y="620">2090</text><text x="1064" y="620">2100</text>
<text x="565" y="650" font-weight="700">Year</text>
<text transform="translate(26 450) rotate(-90)" font-weight="700">Global mean warming (°C above 1850–1900)</text>
</g>

<!-- lines -->
<path d="M92 527 C220 520, 350 490, 480 454 C610 417, 760 374, 900 332 C980 309, 1035 292, 1090 269" fill="none" stroke="#0a67b1" stroke-width="5"/>
<path d="M92 527 C220 521, 350 495, 480 464 C610 432, 760 394, 900 357 C980 337, 1035 324, 1090 313" fill="none" stroke="#ff7600" stroke-width="5" stroke-dasharray="12 8"/>
